<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Admin Account</title>
    <link rel="stylesheet" href="style.css">
</head>
<div class="signup-container">

        <h1>Create Admin Account</h1>
        <p class="subtitle">
            Submit your profile details for system authorization
        </p>
<body>

    <div class="signup-container">

    </div>

</body>
</html>

        <form>

            <label>Full Name</label>
            <input type="text"
                   placeholder="e.g. David Rampeethwane"
                   required>

            <label>Email Address</label>
            <input type="email"
                   placeholder="e.g. david@stayhaven.com"
                   required>

            <label>Organizational Role / Title</label>
            <input type="text"
                   placeholder="e.g. Operations Manager"
                   required>

            <label>Password</label>
            <input type="password"
                   placeholder="Create password"
                   required>

            <label>Confirm Password</label>
            <input type="password"
                   placeholder="Repeat password"
                   required>

            <button type="submit">
                Submit Account Request
            </button>

        </form>

        <p class="login-link">
            Already verified?
            <a href="index.html">Return to Login</a>
        </p>

    </div>

</body>
</html>
