<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayHaven Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-container">

    <div class="logo">
        <img src="logo.png" alt="StayHaven Admin Logo">
    </div>

    <h1>StayHaven Admin</h1>
    <p class="subtitle">Portal authentication & secure gateway</p>

    <form>

        <label>Email Address</label>
        <input type="email" placeholder="admin@stayhaven.com" required>

        <label>Password</label>
        <input type="password" placeholder="**********" required>

        <div class="forgot-password">
        <a href="forgot-password.html">Forgot Password?</a>
        </div>

        <button type="submit">
            Authenticate & Login
        </button>

    </form>

    <p class="signup-text">
        Don't have an account?
        <a href="signup.html">Request Sign Up</a>
    </p>

</div>

</body>
</html>
